name: Build Desk Robot

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 camera robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py generic/esp32-s3-camera-robot \
            --name esp32-s3-camera-robot \
            --language en-US \
            --wake-word wn9_hiwalle_tts2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-camera-robot_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
