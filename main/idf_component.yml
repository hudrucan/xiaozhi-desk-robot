## IDF Component Manager Manifest File
dependencies:
  # Network provisioning and Xiaozhi transports.
  78/esp-wifi-connect: ~3.3.1
  # This package also owns the shared EspNetwork HTTP/WebSocket/MQTT/UDP
  # implementation used by WifiBoard; it is not only a cellular modem driver.
  78/esp-ml307: ~3.7.0

  # Audio encode/decode, resampling, AFE, and wake-word models.
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_audio_codec: ~2.5.0
  espressif/esp-sr: ==2.4.7

  # Current input, camera, display, font, and image pipeline.
  espressif/button: ~4.2.1
  espressif/esp32-camera:
    version: ^2.1.7
    rules:
    - if: target in [esp32s3]
  78/xiaozhi-fonts: ~2.0.0
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.9.0
  espressif/esp_image_effects:
    version: ^1.1.0
    rules:
    - if: target in [esp32s3]
  espressif/esp_new_jpeg: ^1.0.2

  # Downward-facing cliff sensor on the camera I2C bus.
  vl53l0x:
    git: https://github.com/pkolt/vl53l0x-esp-idf.git
    version: 1a7806ca642d670624a42d5f4d647c7b4377529f
    rules:
    - if: target in [esp32s3]

  ## Required IDF version
  idf:
    version: '>=6.0.1'
